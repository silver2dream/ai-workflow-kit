# 這個專案給 AWK 的設定。沒寫的鍵用預設值；每個鍵的說明在
# docs/user/configuration.md。
#
# 改過之後執行 awkit generate：CLAUDE.md、AGENTS.md 與 .claude/rules/_kit/
# 都是從這份檔案產生的。awkit validate 檢查這份檔案。
version: "1.2"

project:
  name: "ai-workflow"
  description: "AI Autonomous Development Workflow"
  type: "single-repo"

repos:
  - name: root
    path: ./
    type: root
    language: go
    verify:
      # Worker 開 pull request 前執行；審查時測試會再跑一次。
      build: "go build ./..."
      test: "go test ./..."

git:
  # pull request 合併進 integration branch；發版從 release branch。
  integration_branch: "develop"
  release_branch: "main"

rules:
  # 專案自己的規則：名稱對應 .claude/rules/<名稱>.md，列在這裡 Worker 才會被要求讀它。
  custom: []

worker:
  # 誰來寫程式：codex 或 claude-code。
  backend: codex

review:
  # 審查分數（滿分 10）達到這個數字才合併，以及合併的方式：squash、merge 或 rebase。
  score_threshold: 7
  merge_strategy: squash

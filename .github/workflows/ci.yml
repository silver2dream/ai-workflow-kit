name: ci

on:
  push:
    branches: ["feat/example", "develop", "main"]
  pull_request:
    branches: ["feat/example", "develop", "main"]

permissions:
  contents: read

jobs:
  awkit_cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Vet
        run: go vet ./...

      - name: Go test (awkit)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Integration tests self-skip when claude CLI / gh auth are absent on
      # the runner. Surface every skip so a green run cannot silently mean
      # "the assertions never executed". Reporting only: failures are already
      # gated by the main test step above.
      - name: Integration-test skip visibility
        run: |
          set -o pipefail
          status=0
          out=$(go test ./... -run Integration -v 2>&1) || status=$?
          echo "$out" | grep -E -- '--- (SKIP|PASS|FAIL)' || echo "no integration test results found"
          exit $status

      - name: AWK evaluation (offline + strict)
        run: |
          go run ./cmd/awkit evaluate --offline
          go run ./cmd/awkit evaluate --offline --strict

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${total}%"
          if (( $(echo "$total < 60" | bc -l) )); then
            echo "::error::Coverage ${total}% is below 60% threshold"
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out

  awkit_cli_windows:
    runs-on: windows-latest
    steps:
      # Keep LF endings: go:embed and content-comparing tests break when
      # autocrlf rewrites the checkout.
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      # Several tests shell out to `sh` (evidence verification, retry tests);
      # Git Bash ships on the runner but its bin dir is not on PATH.
      - name: Add Git Bash to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"

      # Race detector runs on the Linux job; this job guards Windows-specific
      # behavior (paths, ConPTY, process handling).
      - name: Go test (awkit, windows)
        run: go test ./...

  # The project `awkit init --preset godot-go --scaffold` writes is built and
  # tested with the commands of the CI workflows generated for it: the Go
  # backend, and the Godot C# frontend with the .NET SDK and NuGet.
  skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build and test the godot-go skeleton
        env:
          AWKIT_SKELETON_E2E: "1"
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: go test ./internal/install/ -run TestSkeleton -count=1 -v

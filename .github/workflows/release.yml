name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # The workbench's page, built once and put into every awkit.
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the workbench's page
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: workbench-page
          path: internal/workbench/dist
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: page
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            pack: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            pack: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            pack: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            pack: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            pack: zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - uses: actions/download-artifact@v8
        with:
          name: workbench-page
          path: internal/workbench/dist

      # An awkit without the page still builds; a released one must not.
      - name: The page is there
        run: test -f internal/workbench/dist/index.html

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/silver2dream/ai-workflow-kit/internal/buildinfo.Version=${GITHUB_REF_NAME}" -o "dist/awkit${{ matrix.ext }}" ./cmd/awkit

      - name: Package (tar.gz)
        if: matrix.pack == 'tar.gz'
        run: |
          set -euo pipefail
          tar -czf "awkit_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" -C dist awkit

      - name: Package (zip)
        if: matrix.pack == 'zip'
        run: |
          set -euo pipefail
          (cd dist && zip -9 "../awkit_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "awkit${{ matrix.ext }}")

      - name: Set archive path
        run: |
          set -euo pipefail
          if [ "${{ matrix.pack }}" = "tar.gz" ]; then
            echo "ARCHIVE=awkit_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" >> "$GITHUB_ENV"
          else
            echo "ARCHIVE=awkit_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: awkit_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: awkit_*
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/awkit_*
            install.sh
            install.ps1
          overwrite_files: true
